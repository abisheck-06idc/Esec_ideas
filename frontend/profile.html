<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile - ESEC Idea Portal</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f3f6fb; font-family: Arial, sans-serif; color: #1f2937; }
    .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
    .card { background: white; border-radius: 18px; box-shadow: 0 12px 30px rgba(0,0,0,.08); padding: 28px; }
    .header { display: flex; justify-content: space-between; align-items: center; gap: 20px; }
    .avatar-wrap { display: flex; align-items: center; gap: 18px; }
    .avatar { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 3px solid #dbeafe; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 18px; margin-top: 20px; }
    .field { display: flex; flex-direction: column; gap: 8px; }
    label { font-weight: 700; color: #334155; }
    input { width: 100%; padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 8px; }
    .full { grid-column: 1 / -1; }
    .actions { margin-top: 24px; display: flex; gap: 12px; }
    button { border: none; border-radius: 8px; padding: 12px 18px; font-weight: 700; cursor: pointer; }
    .primary { background: #2563eb; color: white; }
    .secondary { background: #e2e8f0; color:#0f172a; }
    .message { display: none; margin-top: 18px; padding: 12px; border-radius: 8px; }
    .success { display: block; background: #dcfce7; color: #166534; }
    .error { display: block; background: #fee2e2; color: #b91c1c; }
    @media(max-width:700px){ .grid { grid-template-columns: 1fr; } .header { flex-direction: column; align-items: flex-start; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="header">
        <div class="avatar-wrap">
          <img id="photo" class="avatar" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=200&q=80" alt="Profile" />
          <div>
            <h2 id="displayName">Profile</h2>
            <p id="roleLabel" style="margin:0; color:#64748b;">Student</p>
          </div>
        </div>
        <button class="secondary" type="button" onclick="window.location.href='student-dashboard.html'">Back</button>
      </div>

      <div id="message" class="message"></div>

      <form id="profileForm">
        <div class="grid">
          <div class="field full">
            <label for="fullName">Full Name</label>
            <input id="fullName" type="text" />
          </div>
          <div class="field">
            <label for="rollNumber">Roll Number</label>
            <input id="rollNumber" type="text" readonly />
          </div>
          <div class="field">
            <label for="department">Department</label>
            <input id="department" type="text" readonly />
          </div>
          <div class="field">
            <label for="year">Year</label>
            <input id="year" type="text" readonly />
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" type="email" readonly />
          </div>
          <div class="field">
            <label for="phoneNumber">Phone Number</label>
            <input id="phoneNumber" type="tel" />
          </div>
          <div class="field full">
            <label for="photoUrl">Profile Photo URL</label>
            <input id="photoUrl" type="url" placeholder="Paste photo URL" />
          </div>
        </div>

        <div class="actions">
          <button class="primary" type="submit">Save Profile</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    async function loadProfile() {
      const token = localStorage.getItem('token');
      if (!token) { window.location.href='login.html'; return; }

      try {
        const profile = await getUserProfile();
        document.getElementById('fullName').value = profile.fullName || '';
        document.getElementById('rollNumber').value = profile.rollNumber || '';
        document.getElementById('department').value = profile.department || '';
        document.getElementById('year').value = profile.year || '';
        document.getElementById('email').value = profile.email || '';
        document.getElementById('phoneNumber').value = profile.phoneNumber || '';
        document.getElementById('photoUrl').value = profile.photoUrl || '';
        document.getElementById('displayName').textContent = profile.fullName || 'Profile';
        document.getElementById('roleLabel').textContent = profile.role || 'Student';
        if (profile.photoUrl) {
          document.getElementById('photo').src = profile.photoUrl;
        }
      } catch (error) {
        document.getElementById('message').textContent = 'Unable to load profile.';
        document.getElementById('message').className = 'message error';
      }
    }

    document.getElementById('profileForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const payload = {
        fullName: document.getElementById('fullName').value.trim(),
        phoneNumber: document.getElementById('phoneNumber').value.trim(),
        photoUrl: document.getElementById('photoUrl').value.trim()
      };

      try {
        const result = await updateUserProfile(payload);
        document.getElementById('displayName').textContent = result.fullName || 'Profile';
        document.getElementById('photo').src = result.photoUrl || document.getElementById('photo').src;
        const msg = document.getElementById('message');
        msg.textContent = 'Profile saved successfully.';
        msg.className = 'message success';
      } catch (error) {
        const msg = document.getElementById('message');
        msg.textContent = error.message || 'Profile save failed.';
        msg.className = 'message error';
      }
    });

    loadProfile();
  </script>
</body>
</html>
