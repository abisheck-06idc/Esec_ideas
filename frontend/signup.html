<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - ESEC Idea Portal</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #0f172a, #1e3a8a); font-family: Arial, sans-serif;
    }
    .card {
      width: min(520px, 92vw); background: #fff; border-radius: 18px; padding: 28px; box-shadow: 0 20px 50px rgba(0,0,0,.25);
    }
    h1 { margin: 0 0 8px; color: #1e3a8a; text-align: center; }
    p { margin: 0 0 24px; color: #64748b; text-align: center; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 16px; }
    .form-group { display: flex; flex-direction: column; gap: 8px; }
    .form-group.full { grid-column: 1 / -1; }
    label { font-size: 14px; font-weight: 700; color: #334155; }
    input, select { width: 100%; padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; }
    input:focus, select:focus { border-color: #2563eb; outline: none; box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
    button {
      width: 100%; margin-top: 16px; border: none; border-radius: 9px; background: #2563eb; color: white;
      font-weight: 700; padding: 14px; cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    .message { display: none; margin-top: 14px; padding: 12px; border-radius: 8px; font-size: 14px; }
    .error { display: block; background: #fee2e2; color: #b91c1c; }
    .success { display: block; background: #dcfce7; color: #166534; }
    .footer { margin-top: 18px; text-align: center; color: #64748b; font-size: 13px; }
    .link { margin-top: 16px; display: block; text-align: center; color: #2563eb; text-decoration: none; }
    @media (max-width: 520px){ .grid{ grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="card">
    <h1>ESEC Idea Portal</h1>
    <p>Create your account</p>
    <div id="message" class="message"></div>
    <form id="signupForm">
      <div class="grid">
        <div class="form-group full">
          <label for="fullName">Full Name</label>
          <input id="fullName" name="fullName" type="text" required />
        </div>
        <div class="form-group">
          <label for="rollNumber">Roll No</label>
          <input id="rollNumber" name="rollNumber" type="text" placeholder="e.g. 21CS045" />
        </div>
        <div class="form-group">
          <label for="department">Department</label>
          <input id="department" name="department" type="text" required />
        </div>
        <div class="form-group">
          <label for="year">Year</label>
          <input id="year" name="year" type="text" required />
        </div>
        <div class="form-group full">
          <label for="email">Email ID</label>
          <input id="email" name="email" type="email" required />
        </div>
        <div class="form-group">
          <label for="role">Role</label>
          <select id="role" name="role" required>
            <option value="">Select role</option>
            <option value="STUDENT">Student</option>
            <option value="ADMIN">Admin</option>
          </select>
        </div>
        <div class="form-group">
          <label for="phoneNumber">Phone Number</label>
          <input id="phoneNumber" name="phoneNumber" type="tel" required />
        </div>
      </div>
      <button type="submit">Sign Up</button>
    </form>
    <a href="login.html" class="link">Already have an account? Login</a>
    <div class="footer">ESEC Incubation & Innovation Portal</div>
  </div>

  <script src="config.js"></script>
  <script>
    const API_URL = (window.APP_CONFIG?.API_BASE_URL || 'http://localhost:8080/api').replace(/\/$/, '');
    const form = document.getElementById('signupForm');
    const message = document.getElementById('message');

    function showMessage(text, type) {
      message.textContent = text;
      message.className = 'message ' + type;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const payload = {
        fullName: document.getElementById('fullName').value.trim(),
        rollNumber: document.getElementById('rollNumber').value.trim(),
        department: document.getElementById('department').value.trim(),
        year: document.getElementById('year').value.trim(),
        email: document.getElementById('email').value.trim(),
        role: document.getElementById('role').value,
        phoneNumber: document.getElementById('phoneNumber').value.trim()
      };

      if (!payload.fullName || !payload.department || !payload.year || !payload.email || !payload.role || !payload.phoneNumber) {
        showMessage('Please fill in all required fields.', 'error');
        return;
      }

      try {
        const response = await fetch(API_URL + '/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(data.message || data.error || 'Signup failed.');
        }

        showMessage('Account created successfully. Redirecting to login...', 'success');
        setTimeout(() => window.location.href = 'login.html', 1000);
      } catch (error) {
        showMessage(error.message || 'Signup failed. Please try again.', 'error');
      }
    });
  </script>
</body>
</html>
