<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - ESEC Idea Portal</title>
  <style>
    body { font-family: Arial, sans-serif; background: #eff6ff; min-height: 100vh; display: grid; place-items: center; margin: 0; }
    main { width: min(440px, 92vw); background: #fff; padding: 32px; border-radius: 16px; box-shadow: 0 12px 32px #0f172a22; }
    h1 { color: #1e3a8a; margin-top: 0; } label { display: block; font-weight: 700; margin: 16px 0 6px; }
    input, select, button { width: 100%; box-sizing: border-box; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; }
    button { margin-top: 22px; border: 0; background: #2563eb; color: #fff; font-weight: 700; cursor: pointer; }
    #message { margin-top: 16px; text-align: center; } a { color: #2563eb; }
  </style>
</head>
<body>
  <main>
    <h1>Create account</h1>
    <form id="signupForm">
      <label for="name">Full name</label><input id="name" required maxlength="100">
      <label for="email">Email</label><input id="email" type="email" required>
      <label for="phoneNumber">Phone number</label><input id="phoneNumber" required maxlength="100">
      <label for="department">Department</label><input id="department" maxlength="100" value="General">
      <label for="role">Account type</label>
      <select id="role"><option value="STUDENT">Student</option><option value="ADMIN">Admin</option></select>
      <button type="submit">Sign up</button>
    </form>
    <p id="message"></p><p>Already registered? <a href="login.html">Log in</a></p>
  </main>
  <script>
    const form = document.getElementById("signupForm");
    const message = document.getElementById("message");
    form.addEventListener("submit", async event => {
      event.preventDefault(); message.textContent = "Creating account...";
      try {
        const response = await fetch("https://idea-nd9r.onrender.com/api/auth/register", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({
          name: document.getElementById("name").value.trim(), email: document.getElementById("email").value.trim(), phoneNumber: document.getElementById("phoneNumber").value.trim(), department: document.getElementById("department").value.trim(), role: document.getElementById("role").value
        }) });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || data.error || "Could not create account");
        localStorage.setItem("token", data.token); localStorage.setItem("userRole", data.role); localStorage.setItem("userEmail", data.email); localStorage.setItem("userName", data.name); localStorage.setItem("userPhone", data.phoneNumber); localStorage.setItem("userDepartment", data.department || "General");
        location.href = data.role === "ADMIN" ? "admin-dashboard.html" : "student-dashboard.html";
      } catch (error) { message.textContent = error.message; message.style.color = "#b91c1c"; }
    });
  </script>
</body>
</html>
